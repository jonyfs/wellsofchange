name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build and prerender
        run: npm run build:site
        env:
          NODE_ENV: production
      
      - name: Create .nojekyll
        run: touch dist/public/.nojekyll
      
      - name: Copy 404.html
        run: cp dist/public/index.html dist/public/404.html

      - name: Stamp sitemap lastmod with the deploy date
        run: |
          today=$(date -u +%Y-%m-%d)
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${today}</lastmod>|g" dist/public/sitemap.xml
          grep -o '<lastmod>[^<]*</lastmod>' dist/public/sitemap.xml
      
      - name: Verify the page carries text without JavaScript
        run: |
          text=$(sed -n 's/.*<div id="root">\(.*\)<\/div>.*/\1/p' dist/public/index.html | sed 's/<[^>]*>//g' | tr -s ' ' | wc -c)
          echo "Body text: ${text} chars"
          if [ "$text" -lt 500 ]; then
            echo "The prerender produced almost no text. Crawlers that skip JavaScript would see an empty page."
            exit 1
          fi

      - name: Verify build has correct base path
        run: |
          if ! grep -q 'href="/' dist/public/index.html; then
            echo "❌ ERROR: Build missing /wellsofchange/ base path!"
            echo "Assets will not load on GitHub Pages!"
            exit 1
          fi
          echo "✅ Base path verified in build"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/public'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  
  test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Wait for deployment to propagate
        run: sleep 30
      
      - name: Test deployed site
        run: |
          chmod +x test-deployed-site.sh
          ./test-deployed-site.sh https://www.wellsofchange.com/
