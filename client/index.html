    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "inLanguage": "pt-BR",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Para onde vai o dinheiro doado?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "As doações financiam a perfuração dos poços, as bombas movidas a energia solar e o monitoramento em tempo real das comunidades atendidas. Os custos operacionais são mantidos baixos com trabalho voluntário e parcerias, para que o máximo possível chegue aos projetos."
          }
        },
        {
          "@type": "Question",
          "name": "Como faço uma doação de fora do Brasil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Por transferência internacional para o Banco do Brasil, usando o código SWIFT BRASBRRJBHE e o IBAN da organização. Os dados completos, incluindo nome e endereço do beneficiário, estão no diálogo de doação do site."
          }
        },
        {
          "@type": "Question",
          "name": "Como faço uma doação do Brasil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Por PIX, usando o CNPJ 43.933.784/0001-13 como chave, ou por transferência bancária para o Banco do Brasil, agência 597-5, conta 42176-6. O valor é escolhido por quem doa."
          }
        },
        {
          "@type": "Question",
          "name": "Quem dirige a Wells of Change?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A organização foi fundada por Ricardo Clemente e é dirigida por Jony Santos, presidente, e Mamour Ndiaye, vice-presidente e cofundador, com uma equipe de voluntários formada por engenheiros, desenvolvedores, geólogos, administradores e comunicadores."
          }
        },
        {
          "@type": "Question",
          "name": "Onde ficam os poços da Wells of Change?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O primeiro poço concluído fica em Campo Formoso, no interior da Bahia. O próximo destino planejado é o Senegal."
          }
        },
        {
          "@type": "Question",
          "name": "Como um poço é mantido depois de construído?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada poço recebe monitoramento remoto, para que falhas apareçam antes de a comunidade ficar sem água. A organização permanece com a comunidade depois da entrega, transferindo as ferramentas e o conhecimento necessários para manter a própria fonte."
          }
        }
      ]
    }
